<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>James Burrow OG Card</title>
<!-- Source for public/img/og-card.jpg (1200x630). Re-render with the command in README.md. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --border: #e7e5e4; --accent: #4f46e5; --accent-soft: #eef2ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, system-ui, sans-serif; color: var(--fg);
    background:
      radial-gradient(circle at 92% 8%, var(--accent-soft) 0, transparent 42%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  /* Indigo edge bar, echoing the site's accent */
  body::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 14px; background: var(--accent); }
  .card { display: flex; align-items: center; gap: 64px; height: 100%; padding: 0 80px 0 96px; }
  .photo {
    flex: none; width: 340px; height: 340px; border-radius: 50%;
    object-fit: cover; border: 8px solid #fff;
    box-shadow: 0 0 0 3px var(--accent), 0 24px 48px rgba(28, 25, 23, .14);
  }
  .eyebrow { margin: 0 0 18px; color: var(--accent); font-weight: 700; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; }
  h1 { margin: 0 0 18px; font-size: 64px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.02; }
  .headline { margin: 0 0 36px; font-size: 32px; font-weight: 500; line-height: 1.3; color: var(--muted); text-wrap: balance; }
  .cta {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 16px 30px; border-radius: 999px;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 26px;
  }
  .site { margin-left: 22px; font-size: 24px; font-weight: 600; color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <img class="photo" src="../public/img/profile.jpg" alt="">
    <div>
      <p class="eyebrow">SEO · GEO · AIO Strategist</p>
      <h1>James Burrow</h1>
      <p class="headline">20 years in search. Now I build the AI tools SEO teams use every day.</p>
      <span class="cta">Book a free consult →</span><span class="site">jamesburrow.com</span>
    </div>
  </div>
</body>
</html>
